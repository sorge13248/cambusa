<div class="pantry-page">
  <!-- Top Action Bar -->
  <div class="page-header">
    <div>
      <h2>Pantry Inventory</h2>
      <p class="subtitle">Real-time stock levels, locations, and expiration tracking.</p>
    </div>
  </div>

  <!-- Reusable Pantry Inventory Grid -->
  <app-pantry-inventory-grid
    mode="pantry"
    [stock]="stock()"
    [products]="products()"
    [locations]="locations()"
    [productGroups]="productGroups()"
    [units]="units()"
    [savedFilters]="savedFilters()"
    [isLoading]="isLoading()"
    [expiringSoonDays]="expiringSoonDays()"
    [syncUrlParams]="true"
    (cardSelected)="openProductActionModal($event)"
    (dateAdjusted)="adjustStockDate($event.item, $event.newDate)"
    (openOneClicked)="openOne($event)"
    (consumeOneClicked)="consume($event, 1)"
    (addStockClicked)="openAddStockModal()"
    (deleteSavedFilterClicked)="deleteSavedFilter($event)"
  ></app-pantry-inventory-grid>

  <!-- Save Filter Modal -->
  @if (isSaveFilterModalOpen()) {
    <div class="modal-backdrop">
      <div class="modal-content filter-save-content">
        <div class="modal-header">
          <h3>Save Filter Preset</h3>
          <button type="button" class="btn btn-secondary btn-sm modal-header-btn modal-close-btn" (click)="isSaveFilterModalOpen.set(false)" aria-label="Close dialog">
            <svg lucideX [size]="14"></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Preset Name</label>
            <input
              type="text"
              [(ngModel)]="newFilterName"
              placeholder="e.g. Fridge items expiring soon..."
              autofocus
            />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="isSaveFilterModalOpen.set(false)">Cancel</button>
          <button class="btn btn-primary" [disabled]="!newFilterName.trim()" (click)="saveCurrentFilter()">
            Save Preset
          </button>
        </div>
      </div>
    </div>
  }

  <!-- Floating Action Buttons -->
  <div class="fab-container">
    <button
      type="button"
      class="fab-btn fab-secondary"
      (click)="openSaveFilterModal()"
      title="Save Current View"
      aria-label="Save Current View"
    >
      <span class="fab-icon"><svg lucideSave [size]="18"></svg></span>
    </button>
    <button
      type="button"
      class="fab-btn fab-primary"
      (click)="openAddStockModal()"
      title="Add Item"
      aria-label="Add Item"
    >
      <span class="fab-icon"><svg lucidePlus [size]="24"></svg></span>
    </button>
  </div>

  <app-quick-actions-footer (stockChanged)="loadStock()"></app-quick-actions-footer>
</div>
