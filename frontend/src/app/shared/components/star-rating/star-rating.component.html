<div
  class="star-rating"
  [class.is-readonly]="readonly()"
  role="group"
  [attr.aria-label]="ariaLabel()"
  (mouseleave)="onMouseLeave()"
>
  @if (!readonly() && showClear() && value() !== null) {
    <button
      type="button"
      class="clear-rating-btn"
      aria-label="Clear rating"
      title="Clear rating"
      (click)="clearRating()"
    >
      <svg lucideX [size]="14"></svg>
    </button>
  }

  <div class="stars-row">
    @for (star of stars; track star) {
      @if (readonly()) {
        <span
          class="star-icon"
          [class.is-filled]="star <= displayValue()"
          [attr.aria-label]="star + (star === 1 ? ' star' : ' stars')"
        >
          <svg
            lucideStar
            [size]="size()"
            [attr.fill]="star <= displayValue() ? 'currentColor' : 'none'"
          ></svg>
        </span>
      } @else {
        <button
          type="button"
          class="star-btn"
          [class.is-filled]="star <= displayValue()"
          [class.is-hovered]="hoveredStar() !== null && star <= hoveredStar()!"
          [attr.aria-label]="'Rate ' + star + (star === 1 ? ' star' : ' stars')"
          [attr.aria-pressed]="value() === star"
          (mouseenter)="onMouseEnter(star)"
          (click)="selectStar(star)"
        >
          <svg
            lucideStar
            [size]="size()"
            [attr.fill]="star <= displayValue() ? 'currentColor' : 'none'"
          ></svg>
        </button>
      }
    }
  </div>
</div>
