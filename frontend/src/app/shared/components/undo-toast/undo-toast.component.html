@if (action(); as act) {
  <div
    class="undo-toast-shell"
    role="alert"
    aria-live="polite"
    (mouseenter)="pause()"
    (mouseleave)="resume()"
    [class.is-paused]="isPaused()"
  >
    <div class="toast-content">
      <svg lucideUndo2 [size]="16" class="action-icon"></svg>
      <span class="action-desc">{{ act.description }}</span>
      <button type="button" class="btn-undo" (click)="undo()">
        Undo ({{ act.remainingSeconds }}s)
      </button>
      <button type="button" class="btn-close" (click)="dismiss()" title="Dismiss" aria-label="Dismiss">
        <svg lucideX [size]="14"></svg>
      </button>
    </div>
    <div
      class="toast-progress-bar"
      [style.animationDuration]="act.totalSeconds + 's'"
    ></div>
  </div>
}
