<section class="modal-shell" role="alertdialog" aria-modal="true" aria-labelledby="update-title">
  <div class="update-icon-badge" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
    </svg>
  </div>

  <header>
    <h2 id="update-title">Update Available</h2>
    <p>A new version of Cambusa is available. Refresh the application to apply the latest improvements and features.</p>
  </header>

  <footer>
    <button type="button" class="btn btn-secondary ghost" (click)="dismiss()">
      Later
    </button>
    <button type="button" class="btn btn-primary primary" (click)="reload()">
      Refresh Now
    </button>
  </footer>
</section>
